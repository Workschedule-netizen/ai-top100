name: 更新 AI TOP100 榜单

on:
  schedule:
    # 每 12 小时一次（时间是 UTC 0:17 与 12:17，即台北时间 8:17 与 20:17；第 17 分钟执行，避开整点高峰）
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      monthly:
        description: "这次也强制更新汇率"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 每月第一次执行：更新汇率（免费公开汇率，不需要金钥）；其他时候自动跳过，这步失败也不影响后面
      - name: 每月更新汇率
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          FORCE_MONTHLY: ${{ inputs.monthly }}
        run: |
          if ($env:FORCE_MONTHLY -eq 'true') { ./update-monthly.ps1 -Force } else { ./update-monthly.ps1 }

      - name: 更新榜单数据
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update-ranking.ps1

      # GitHub Skills 推荐：本周 GitHub 前十、爆红 Skills、精选星数
      # 不论榜单那步成功与否都会执行；这步失败也不影响榜单提交
      - name: 更新 GitHub Skills 推荐
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update-github-skills.ps1

      - name: 提交更新
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html update.log
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "自动更新榜单 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
