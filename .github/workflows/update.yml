name: 更新 AI TOP100 榜单

on:
  schedule:
    # 每 2 小时一次（时间是 UTC；第 17 分钟执行，避开整点高峰）
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 更新榜单数据
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update-ranking.ps1

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html update.log
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "自动更新榜单 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
