<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>全球 AI 工具与技能 TOP100</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 页首（标题＋更新时间＋日夜切换）→ 工具列（分页＋搜索）→ 两栏「榜单 | 详情或推荐」；对比列固定在底部；手机版单栏，详情以全屏面板打开 */
:root{
  --bg:#f3f2ee; --panel:#ffffff; --panel-2:#f7f6f2; --line:#e6e3dc; --ink:#1d1c1a; --muted:#87837a;
  --pill:#3b3a37; --pill-ink:#ffffff; --accent:#e2611c; --quote:#4b6bd6; --hover:#ecebe5;
  --ok:#2f8f5b; --ok-soft:#e3f2e8; --warn:#b97c0c; --warn-soft:#fbf0d6; --wait:#3d74c9; --wait-soft:#e8eef9;
  --bad:#d23b2e; --bad-soft:#fbe7e4; --idle-soft:#efede8; --skillc:#16907f; --scrim:rgba(29,28,26,.38);
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans TC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1917; --panel:#23221f; --panel-2:#2a2925; --line:#36342f; --ink:#ecebe6; --muted:#9a968c;
  --pill:#e9e7e1; --pill-ink:#1a1917; --accent:#f07a37; --quote:#7f9cf0; --hover:#302e2a;
  --ok:#3fa86f; --ok-soft:#1f3328; --warn:#c98f22; --warn-soft:#3a3020; --wait:#5f8fdf; --wait-soft:#1f2a3d;
  --bad:#e0503f; --bad-soft:#41231f; --idle-soft:#2b2a26; --skillc:#3cbfac; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1917; --panel:#23221f; --panel-2:#2a2925; --line:#36342f; --ink:#ecebe6; --muted:#9a968c;
  --pill:#e9e7e1; --pill-ink:#1a1917; --accent:#f07a37; --quote:#7f9cf0; --hover:#302e2a;
  --ok:#3fa86f; --ok-soft:#1f3328; --warn:#c98f22; --warn-soft:#3a3020; --wait:#5f8fdf; --wait-soft:#1f2a3d;
  --bad:#e0503f; --bad-soft:#41231f; --idle-soft:#2b2a26; --skillc:#3cbfac; --scrim:rgba(0,0,0,.6); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--quote);outline-offset:2px}
a{color:var(--quote)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.app{display:flex;flex-direction:column;height:100%}

/* 页首 */
.ph{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding-block:18px 10px;flex:none}
.ph h1{margin:0;font-size:20px;display:flex;gap:10px;align-items:center}
.ph h1 .sq{width:18px;height:18px;background:var(--accent);border:2px solid var(--ink);border-radius:3px;flex:none}
.meta{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.meta .live{display:inline-flex;align-items:center;gap:6px}
.meta .live i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.linkbtn{border:0;background:none;padding:0;color:var(--quote);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.theme{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 11px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.theme:hover{background:var(--hover)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:none;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink);font-weight:700}
.cur{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 8px;font-size:12.5px}
html[lang="zh-Hant"]{--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans SC",system-ui,sans-serif}
html[lang="en"]{--sans:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}

/* 工具列 */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:4px 14px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);flex:none}
.seg button{border:0;background:none;padding:8px 14px;font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected="true"]{background:var(--pill);color:var(--pill-ink);font-weight:700}
.seg button .n{font-family:var(--mono);font-size:11px;opacity:.7}
.search{flex:1 1 300px;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:3px 3px 3px 12px}
.search:focus-within{border-color:var(--quote)}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px;padding:6px 0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.dark{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}
.btn.dark:hover:not(:disabled){opacity:.88;background:var(--pill)}
.btn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.btn.sm{padding:3px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}

/* 两栏 */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:14px;padding-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}

/* 筛选 */
.filters{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.fsel{flex:none;display:grid;gap:6px}
.filters select{flex:none;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:4px 8px;font-size:12.5px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--ink);background:var(--hover)}
.chip .mono{font-size:11px;margin-left:2px}
.chip[aria-pressed="true"]{background:var(--pill);border-color:var(--pill);color:var(--pill-ink);font-weight:700}
.chip.hotchip{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.chip.hotchip[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}

/* 榜单 */
.rows{flex:1;overflow-y:auto;min-height:0}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 116px 70px;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px 10px 12px;box-shadow:inset 3px 0 0 var(--edge,transparent)}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{background:var(--wait-soft);--edge:var(--wait)}
.row.top3{--edge:var(--accent)}
.head{position:sticky;top:0;z-index:1;background:var(--panel-2);font-size:11px;color:var(--muted);letter-spacing:.06em;padding-block:6px;cursor:default}
.head:hover{background:var(--panel-2)}
.rk{font-family:var(--mono);font-weight:700;font-size:15px;display:grid;line-height:1.2}
.row.top3 .rk{color:var(--accent)}
.mv{font-size:10px;font-weight:700}
.mv.up{color:var(--bad)} .mv.down{color:var(--ok)} .mv.new{color:var(--bad)}
.nm{min-width:0;display:grid;gap:1px}
.nm b{font-size:14.5px;display:flex;gap:6px;align-items:baseline;min-width:0}
.nm b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot-dot{flex:none;font-size:10.5px;font-weight:700;color:var(--bad)}
.fav-dot{flex:none;font-size:12px;color:var(--warn)}
.typ{flex:none;font-size:10.5px;font-weight:700;color:var(--muted)}
.pr{font-size:12px;font-weight:500;white-space:nowrap}
.prc{display:grid;gap:1px;line-height:1.25}
.prc small{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.favrow{cursor:default}
.favrow:hover{background:none}
.favname{border:0;background:none;padding:0;text-align:left;min-width:0;display:grid;gap:1px}
.favname:hover b span{text-decoration:underline;text-decoration-color:var(--quote)}
.unfav{justify-self:end;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 9px;font-size:12px;color:var(--muted);white-space:nowrap}
.unfav:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.pr.free{color:var(--ok)} .pr.fm{color:var(--wait)} .pr.paid{color:var(--warn)}
.sc{display:grid;gap:4px;justify-items:end}
.sc b{font-family:var(--mono);font-size:13px;font-weight:500}
.meter{width:100%;height:3px;border-radius:99px;background:var(--idle-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tc,var(--wait))}
.row.top3 .meter i{background:var(--accent)}
.skillboard{--tc:var(--skillc)}
.empty{margin:auto;color:var(--muted);font-size:13px;text-align:center;padding:28px 16px;line-height:1.7}

/* 右栏 */
.side .top{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.side .top .ttl{flex:1;min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .top .back{display:none}
.rnav{display:flex;gap:4px}
.rnav button{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:28px;height:26px}
.rnav button:disabled{opacity:.35}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:16px 18px 22px;display:flex;flex-direction:column;gap:16px}
.scroll>*{flex:none}
.d-name{margin:0;font-size:22px;line-height:1.25;text-wrap:balance}
.d-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{padding:8px 12px;display:grid;gap:1px}
.stats div+div{border-left:1px solid var(--line)}
.stats span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.stats b{font-size:17px;font-family:var(--mono)}
.basis{font-size:12px;color:var(--muted);margin-top:-8px}
.note{border-radius:9px;padding:8px 12px;font-size:13px;display:flex;gap:8px}
.note b{white-space:nowrap}
.note.hot{background:var(--bad-soft)} .note.hot b{color:var(--bad)}
.note.tip{background:var(--warn-soft)} .note.tip b{color:var(--warn)}
.intro{margin:0;font-size:14px;line-height:1.75}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.sec h3{margin:0 0 5px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.08em}
.sec ul{margin:0;padding-left:1.1em;font-size:13.5px;display:grid;gap:3px}
.sec p{margin:0;font-size:13.5px}
.sec.pros li::marker{color:var(--ok)} .sec.cons li::marker{color:var(--bad)}
.code{display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:6px 6px 6px 10px}
.code code{flex:1;min-width:0;font-family:var(--mono);font-size:12px;overflow-x:auto;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tierwrap{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tiers{border-collapse:collapse;width:100%;font-size:13px}
.tiers th,.tiers td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tiers tr:last-child td{border-bottom:0}
.tiers thead th{font-size:11.5px;color:var(--muted);font-weight:500;background:var(--panel-2);letter-spacing:.04em}
.tiers td.v{font-family:var(--mono);font-weight:700;white-space:nowrap}
.tiers td.v.fr{color:var(--ok);font-family:var(--sans)}
.tiers td.o{font-family:var(--mono);color:var(--muted);font-size:12px;white-space:nowrap}
.tiers small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;font-family:var(--sans);white-space:normal}
.favsum{padding:12px 14px;font-size:13px;background:var(--warn-soft);border-top:1px solid var(--line)}
.favsum b{font-family:var(--mono);color:var(--warn)}
.cmp .tl{display:grid;gap:2px;font-size:12.5px}
.thin{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:9px;padding:8px 12px}

/* 推荐 */
.intent{font-size:13px;background:var(--wait-soft);border-radius:9px;padding:8px 12px}
.intent b{color:var(--quote)}
.grp{display:grid;gap:6px}
.grp h3{margin:0;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.08em}
.res{display:grid;gap:2px;text-align:left;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 12px}
.res:hover{background:var(--panel-2)}
.res .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.res .l1 b{font-size:14px}
.res .l1 .rkt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.res .l2{font-size:12.5px;color:var(--muted)}
.res .why{font-size:12px}
.res.ai{border-color:var(--quote)}
.ex{display:flex;flex-wrap:wrap;gap:6px}

/* 对比列与对比表 */
.tray{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 12px 30px -12px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.tray .lbl{font-size:12.5px;color:var(--muted)}
.tray .it{display:inline-flex;gap:2px;align-items:center;font-size:12.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:1px 2px 1px 10px}
.tray .it button{border:0;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0 6px}
.cmp-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.cmp{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.cmp tr:last-child th,.cmp tr:last-child td{border-bottom:0}
.cmp thead th{background:var(--panel-2);font-size:14px;color:var(--ink)}
.cmp tbody th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap;width:84px;background:var(--panel-2)}
.cmp td ul{margin:0;padding-left:1.1em;display:grid;gap:2px}
.cmp .best{color:var(--accent);font-weight:700}

/* 弹窗与提示 */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:60}
.modal{max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(680px,100%);padding:18px;display:grid;gap:10px}
.modal.wide{width:min(1000px,100%)}
.modal h3{margin:0;font-size:17px}
.modal h4{margin:6px 0 0;font-size:13px}
.modal p,.modal ul{margin:0;font-size:13px;color:var(--muted)}
.modal ul{padding-left:1.1em;display:grid;gap:4px}
.mrow{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--pill);color:var(--pill-ink);padding:8px 16px;border-radius:10px;font-size:13px}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;padding-bottom:70px}
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .body{display:flex;flex-direction:column}
  .rows{overflow:visible}
  .side.mode-search{order:-1}
  .side.mode-search .scroll{overflow:visible}
  .side.mode-detail{display:none;position:fixed;inset:0;z-index:50;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.mode-detail.open{display:flex}
  .side .top .back{display:inline-flex}
  .side.mode-empty{display:none}
  .seg{flex:1 1 100%}
  .seg button{flex:1;justify-content:center;padding:8px 6px;font-size:13px}
}
@media (max-width:560px){
  .row{grid-template-columns:34px minmax(0,1fr) 96px;gap:10px}
  .row .sc,.head span:nth-child(4){display:none}
  .prc{justify-items:end;text-align:right}
  .favrow{grid-template-columns:34px minmax(0,1fr) auto}
  .favrow .prc{display:none}
  .meter{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
  .seg button .n{display:none}
}
</style>

}

"chatgpt":{"s":"The world's most-visited general AI assistant: chat, search, image generation and agents in one place.","d":{"intro":"OpenAI's general-purpose AI assistant and the most-visited AI product in the world (about 8.2B visits per Semrush and 5.9B per Similarweb in Sept 2026). It combines chat, web search, deep research, image generation, voice, file analysis and agent tasks in one interface, covering almost every everyday work and study scenario.","features":["Multimodal chat: type, paste images, talk or upload files","Web search and Deep Research that produce cited reports","Image generation and editing in plain language","GPTs and agent mode: custom assistants or multi-step tasks done for you"],"useCases":["Drafting and editing writing, emails and proposals","Study help, organizing material, data analysis","Coding Q&A and debugging"],"pros":["Most complete feature set and biggest ecosystem of tutorials and templates","Ships new features fast; strong in Chinese too"],"cons":["Free quota is limited at peak times","Not directly accessible in mainland China"],"tip":"Hand long tasks to Deep Research and use the default mode for everyday questions; giving it a clear role and output format improves results noticeably."}},
"gemini":{"s":"Google's AI assistant with a huge context window, deeply wired into Search, Gmail and Android.","d":{"intro":"Google's AI assistant, deeply integrated with Search, Gmail, Docs, YouTube and Android. Its signature is a very long context window that can read a whole book, a long video or a large codebase at once. It is solidly second in monthly visits and one of the fastest-growing assistants of 2026.","features":["Very long context for whole books, long videos and large documents","Works inside Google Workspace: call it from Gmail, Docs and Sheets","Deep Research with sourced answers","Image generation (Nano Banana) and video generation (Veo)"],"useCases":["Sorting email and calendar, summarizing long documents","Taking notes from videos and papers","An on-the-go assistant on Android phones"],"pros":["Seamless with the Google ecosystem","Strong multimodal and long-text abilities"],"cons":["Some advanced features depend on region and subscription","Not directly accessible in mainland China"],"tip":"@-mention files in Google Drive instead of copy-pasting them into Gemini."}},
"claude":{"s":"One of the best-regarded assistants for writing, long documents and coding; fastest-growing share.","d":{"intro":"Anthropic's AI assistant, known for writing quality, long-document understanding, coding ability and careful safety design. According to Visual Capitalist, its traffic share among AI chat assistants more than quadrupled in a year. Claude also drives an ecosystem including Claude Code, Agent Skills and MCP.","features":["Long-document reading and careful writing with a natural tone and clear structure","Artifacts: generate interactive web pages, charts and documents directly","Projects knowledge bases and connectors for Google Drive, Notion and more","Agent Skills and MCP turn it into an agent that can work with files and tools"],"useCases":["Reports, papers and long-form writing and review","Coding, code review and architecture design","Turning material into shareable pages or documents"],"pros":["Highly rated for writing and coding quality","Open ecosystem: its MCP protocol became an industry standard"],"cons":["Free quota is relatively tight","Not directly accessible in mainland China"],"tip":"Put background material in a Project, then start new chats there; Claude will keep referring to it."}},
"canva":{"s":"Online design platform whose Magic Studio generates posters, slides and short videos with AI.","d":{"intro":"The world's most popular online design platform. Magic Studio brings AI generation and editing into templates for posters, slides, short videos and social graphics, so non-designers can describe what they want and get a draft fast. It is one of the main ways non-technical users meet AI.","features":["Magic Design: describe it and get a full design set","AI image generation, expand, background removal and Magic Eraser","Magic Write copywriting and multilingual translation","Huge template library and brand kits for consistent team style"],"useCases":["Social media images and short videos","Presentations, posters and résumés","Brand materials for small teams"],"pros":["Zero learning curve, endless templates","Design, video and docs in one place"],"cons":["AI output is average in detail and originality","Premium assets cost extra"],"tip":"Generate a first draft with Magic Design, then tweak a template by hand; it is much faster than starting from scratch."}},
"deepseek":{"s":"Open-source, low-cost Chinese model with strong reasoning; free to use in China.","d":{"intro":"DeepSeek's models and chat app, known for open weights, very low inference cost and strong reasoning. The R1 release in early 2025 drew global attention, and it remains one of the most-used AI apps in China, with heavy developer use of its API.","features":["DeepThink mode shows its reasoning; strong at math and code","Web search with cited sources","Open model weights for local or private deployment","Cheap API compatible with the OpenAI format"],"useCases":["Math derivations and coding problems","Chinese writing and information lookup","Private enterprise deployment of an LLM"],"pros":["Free and directly accessible in China","Open source and self-hostable"],"cons":["Occasional \"server busy\" at peak times","Multimodal ability lags top overseas products"],"tip":"Turn on DeepThink for rigorous reasoning; switch it off for simple questions to get faster replies."}},
"claude-code":{"s":"Coding agent for terminal and desktop that completes multi-step dev tasks on its own, with native skills support.","d":{"intro":"Anthropic's coding agent, available in the terminal, VS Code and JetBrains extensions, a desktop app and the web. In JetBrains' May–July 2026 survey of 15,000+ professional developers, 39% use Claude Code at work, the most of any AI coding tool, and 31% use it as their main tool.","features":["Understands the whole codebase and edits across many files","Runs commands and tests itself and fixes based on the results","Extensible with Agent Skills, MCP, subagents and hooks","Plan mode: proposes a plan and waits for approval before editing"],"useCases":["Building features or whole apps from scratch","Fixing bugs, refactoring and adding tests","Handling PR review comments and CI failures"],"pros":["Top usage and satisfaction among AI coding tools","Complete ecosystem: skills, plugins and MCP all plug in"],"cons":["Heavy use burns through quota quickly","You need to be comfortable with a terminal or IDE"],"tip":"Write a CLAUDE.md at the project root describing your stack and conventions, and use grill-me to pin down requirements before starting."}},
"grok":{"s":"AI assistant tied into X, selling real-time news and reasoning.","d":{"intro":"The AI assistant from Elon Musk's xAI, which merged into SpaceX in Feb 2026 while keeping the Grok name. It is deeply integrated with X (formerly Twitter), can read live discussions on the platform, and has a blunt style; real-time information is its main selling point.","features":["Real-time search over X posts and news","DeepSearch and reasoning modes","Image and video generation (Grok Imagine)","Voice chat and companion characters"],"useCases":["Tracking breaking events and public opinion","Explaining tech and finance news","Casual chat and creative writing"],"pros":["Strong real-time information","Direct answering style"],"cons":["Sources lean heavily on X; cross-check them","Not directly accessible in mainland China"],"tip":"When asking about live events, have it list links to the original posts so you can judge credibility."}},
"doubao":{"s":"ByteDance's AI assistant, a leader in Chinese monthly users, with great voice calls and AI search.","d":{"intro":"ByteDance's AI assistant built on the Doubao models and one of China's AI apps with the most monthly active users. It covers chat, writing, AI search, image and video generation and real-time voice calls, and connects with Douyin, CapCut (Jianying) and other ByteDance products.","features":["Real-time voice calls with a natural tone, good for speaking practice","AI search and page summaries, with a browser extension","Image generation and AI photo retouching","Agent templates for slides, documents, coding and more"],"useCases":["Everyday Q&A and life assistant","Homework help and essay coaching for students","Copy and images for short-video creators"],"pros":["Works directly in China with a generous free quota","Excellent voice interaction"],"cons":["Weaker than top overseas models on deep professional tasks","Leans toward lifestyle and entertainment"],"tip":"Install the Doubao browser extension; select text on any page to translate or summarize it."}},
"character-ai":{"s":"Chat with all kinds of virtual characters; extremely sticky with young users.","d":{"intro":"A platform for chatting and role-playing with AI characters, from anime figures and historical people to characters users create. About 176M visits in Sept 2026 (Semrush), making it the highest-traffic entertainment AI product.","features":["Huge library of community-made characters to chat with","Create your own character with personality, backstory and voice","Voice calls with the character's own voice","Group chats with several characters and story scenes"],"useCases":["Casual fun and companionship","Practicing foreign-language conversation","Drafting character dialogue for novels and scripts"],"pros":["Huge variety and strong immersion","Most features are free"],"cons":["Entertainment-focused; not for work or research","Open-ended chat is restricted for minors"],"tip":"When creating a character, spell out its backstory, catchphrases and sample dialogue; it will behave much more consistently."}},
"github-copilot":{"s":"The most-installed AI coding assistant across VS Code, JetBrains and GitHub.com.","d":{"intro":"GitHub's (Microsoft's) AI coding assistant, built into VS Code, Visual Studio, JetBrains and other editors plus the GitHub website. In JetBrains' 2026 survey, 21% of professional developers use it at work, ranking second; in companies with 5,000+ employees it is still the most widespread AI coding tool.","features":["Code completion and in-editor chat","Agent mode plus a cloud coding agent that takes issues and opens PRs","Automatic code review on pull requests","Choice of models from several vendors"],"useCases":["Day-to-day development in enterprise teams","Automatically handling issues and PRs on GitHub","Students and open-source developers (free quota)"],"pros":["Deep GitHub integration and easy enterprise procurement","Supports the most editors"],"cons":["Usage is being overtaken by agents such as Claude Code","Premium model requests have a monthly cap"],"tip":"Assign an issue straight to the Copilot cloud agent and let it open a PR in the background; you just review."}},
"deepl":{"s":"AI translator famous for natural output, with whole-document translation and writing polish.","d":{"intro":"The AI translation service from Germany's DeepL, known for natural, native-sounding output. About 149M visits in Sept 2026 (Semrush), the most of any dedicated translation tool, plus DeepL Write for polishing text.","features":["Text and whole-document translation (Word, PowerPoint, PDF) that keeps the layout","DeepL Write: rewrite and polish text","Glossaries to keep terminology consistent","Desktop app and browser extension: select text to translate"],"useCases":["Reading foreign-language material and websites","Translating business email, contracts and reports","Polishing English writing"],"pros":["Fluent, natural translations","Document translation keeps formatting"],"cons":["Free tier is limited","Fewer languages than Google Translate"],"tip":"Build a glossary before translating professional documents so company names, product names and jargon stay consistent."}},
"codex":{"s":"OpenAI's coding agent that runs dev tasks in parallel in the cloud and the CLI.","d":{"intro":"OpenAI's coding agent, offered as an open-source CLI (Codex CLI), IDE extension, desktop app and cloud version that can run many tasks in parallel. In JetBrains' 2026 survey, 16% of professional developers use it at work, ranking third.","features":["Runs multiple dev tasks in parallel in cloud sandboxes","Open-source Codex CLI for your local terminal","Automatic code review","Tied into your ChatGPT account and subscription"],"useCases":["Batching unrelated small tasks and bugs","Code review before committing","Developers who already pay for ChatGPT"],"pros":["Strong at parallel multi-tasking","Works out of the box with a ChatGPT subscription"],"cons":["Cloud tasks need an environment set up first","Interactive debugging is weaker than local agents"],"tip":"Hand several unrelated small tasks to the cloud at once, then review each result."}},
"perplexity":{"s":"An \"answer engine\" for AI search: every answer cites sources, a research replacement for classic search.","d":{"intro":"An AI search tool positioned as an \"answer engine\". Every answer is annotated with sources so you can verify it, making it a popular replacement for classic search when researching. It also offers the Comet browser, where AI can complete tasks on web pages for you.","features":["Real-time web search with sentence-level citations","Research mode for long-form reports","Spaces to organize material and chats by topic","Comet AI browser that acts across web pages"],"useCases":["Market and competitor research","Finding the latest news and data","Academic literature lookup"],"pros":["Transparent sources, easy to verify","Choice of several models"],"cons":["Weaker than general assistants for creative tasks","Citation quality is occasionally uneven"],"tip":"Add a time range or site restriction to your question (e.g. \"only 2026\") for more accurate results."}},
"microsoft-copilot":{"s":"AI assistant built into Windows and Office, covering the most enterprise office scenarios.","d":{"intro":"Microsoft's AI assistant, built into Windows, Edge, Bing and Microsoft 365 (Word, Excel, PowerPoint, Outlook, Teams). For people and companies already on Office, it is the most direct way to bring AI into everyday document work.","features":["Draft, rewrite and generate decks in Word and PowerPoint","Analyze data and write formulas in Excel with plain language","Automatic Teams meeting notes and action items","System-level Windows assistant with voice and screen understanding"],"useCases":["Enterprise document work","Meeting notes and email triage","Spreadsheet analysis"],"pros":["Deep Office integration","Enterprise-grade data security and compliance"],"cons":["Standalone chat is weaker than dedicated assistants","Enterprise licences are pricey"],"tip":"In PowerPoint, reference a Word document and let Copilot build the whole deck from it."}},
"remove-bg":{"s":"Removes image backgrounds automatically in seconds.","d":{"intro":"An online tool, owned by Canva, that removes image backgrounds in one click. About 106M visits in Sept 2026 (Semrush), the most-used AI background remover.","features":["Cuts out people, products and animals in seconds","Batch processing and API","Swap in a background color or image in one click","Plugins for Photoshop and other software"],"useCases":["Changing ID photo backgrounds","White-background product shots for e-commerce","Assets for posters and slides"],"pros":["Fast, handles hair and edges well","No install, works in the browser"],"cons":["HD downloads cost money","Occasionally misjudges the subject in complex scenes"],"tip":"For slides or social posts, the free preview resolution is usually enough."}},
"suno":{"s":"Turn lyrics or a description into a complete song with vocals and arrangement.","d":{"intro":"An AI music platform: enter lyrics or a style description and get a complete song with vocals and arrangement. About 105M visits in Sept 2026 (Semrush), the most-visited AI music tool.","features":["Generate full songs (vocals + backing) from text","Custom lyrics, genre and length","Extend, cover and stem editing","Fine-tune arrangements in Suno Studio"],"useCases":["Background music for short videos","Birthday songs, jingles and event themes","Inspiration for songwriting"],"pros":["Fast and polished results","Sings Chinese lyrics too"],"cons":["Free-tier songs cannot be used commercially","AI music copyright is still disputed"],"tip":"Describe the style precisely (genre, tempo, instruments, mood); it works far better than just \"pop song\"."}},
"capcut":{"s":"Video editor with built-in AI captions, voiceover and cutouts; a must for short-video creators.","d":{"intro":"ByteDance's video editor (CapCut internationally, Jianying in China) with many built-in AI features; one of the most-used editors among short-video creators. The CapCut site had about 98.5M visits in Sept 2026 (Semrush), plus a huge mobile app user base.","features":["Auto captions with translation into many languages","AI voiceover and text-to-speech","Smart cutout, background removal and quality enhancement","One-tap templates"],"useCases":["Douyin, TikTok and Reels shorts","Vlogs and tutorial videos","E-commerce product videos"],"pros":["Easy to learn, lots of templates","Works on phone, desktop and web"],"cons":["Some AI features are paid","Pro color grading and multitrack work lag dedicated software"],"tip":"Generate subtitles with Auto Captions first, then restyle them all at once; much faster than typing."}},
"cursor":{"s":"The most popular AI code editor; understands the whole codebase and edits code autonomously.","d":{"intro":"Anysphere's AI code editor, built on VS Code and one of the most popular AI coding tools. It understands the whole codebase and offers multi-file edits and an autonomous Agent mode. SpaceX completed its acquisition of Cursor in Aug 2026; the product runs as usual.","features":["Tab completion that predicts your next edit","Agent mode: reads code, edits many files and runs commands on its own","Codebase-wide semantic search and Q&A","Choice of top models; supports MCP, rule files and Agent Skills"],"useCases":["Everyday development and refactoring","Prototyping an app or website from scratch","Reading and understanding unfamiliar codebases"],"pros":["Keeps your VS Code extensions and habits","Industry-leading AI completion"],"cons":["Heavy use burns through quota quickly","Automatic edits in large projects need careful review"],"tip":"Use the grill-me skill to clarify requirements before letting Cursor write code, and keep a rules file describing your stack to cut rework dramatically."}},
"lovable":{"s":"Generate a complete web app from one sentence; a favorite for non-programmers building prototypes.","d":{"intro":"A platform that builds complete web apps through chat: describe your product and it writes the frontend, wires up the database and login, and deploys in one click. About 81.5M visits in Sept 2026 (Semrush) and #15 in Similarweb's AI category; one of the most-used tools for non-programmers making prototypes.","features":["Generate full web apps in natural language","Built-in database, login and file storage (Supabase)","Visual point-and-click UI edits","One-click deploy; code syncs to GitHub"],"useCases":["Turning startup ideas into usable prototypes","Internal tools","Portfolio or event sites"],"pros":["Build a working product without coding","Exportable code a developer can take over"],"cons":["Complex business logic can get stuck","Credits are per message, so repeated edits burn them fast"],"tip":"Write a clear feature list first (e.g. with grill-me) and describe it to Lovable in one go to save lots of credits."}},
"elevenlabs":{"s":"The most lifelike AI voiceover and voice cloning, in dozens of languages, plus voice agents.","d":{"intro":"An AI voice platform famous for natural voiceover and voice cloning. About 78.8M visits in Sept 2026 (Semrush). It turns text into speech in many languages and voices, dubs videos into other languages and powers voice customer-service agents.","features":["Text-to-speech in dozens of languages with many voices","Voice cloning (with the speaker's consent)","Video dubbing that keeps the original speaker's voice","Voice agents plus sound-effect and music generation"],"useCases":["Audiobooks, podcasts and narration","Multilingual video dubbing","Voice bots for customer service"],"pros":["Leading audio quality and emotion","Strong multilingual ability"],"cons":["Small free quota","Voice cloning can be abused; follow consent rules"],"tip":"Generate long text in sections and adjust pace and pauses per section; it sounds more natural than one long take."}},
"grammarly":{"s":"English grammar checking and rewriting assistant built into browsers and office apps."},
"higgsfield":{"s":"AI video and image studio with cinematic camera moves, aggregating many generation models."},
"notebooklm":{"s":"Ask questions about uploaded material, get podcast-style audio overviews and mind maps; renamed July 2026.","d":{"intro":"Google's AI research notebook, formerly NotebookLM and renamed Gemini Notebook in July 2026. Upload PDFs, web pages, YouTube videos and more; the AI answers only from those sources with citations and can turn them into podcast-style audio overviews and mind maps.","features":["Q&A grounded in your sources, with citations","Audio Overviews: two AI hosts discuss your material","Mind maps, study guides and flashcard quizzes","New in 2026: code execution to analyze data in your sources"],"useCases":["Taking notes on papers and books","Exam revision","Organizing meeting and project material"],"pros":["Answers stick to your sources and rarely make things up","Audio Overviews are great for commuting"],"cons":["Only answers within the uploaded material","Not directly accessible in mainland China"],"tip":"Keep one topic per notebook for more focused answers."}},
"meta-ai":{"s":"AI assistant built into WhatsApp, Instagram and Facebook."},
"quillbot":{"s":"English paraphrasing, grammar checking and AI detection; most popular with students."},
"huggingface":{"s":"The largest community for open models and datasets — the \"GitHub of AI\"."},

"google-ai-studio":{"s":"Try the full Gemini lineup for free, get an API key and build AI apps fast."},

"find-skills":{"s":"Lets the AI search the skills.sh directory for skills you need and install them; #1 by installs.","d":{"intro":"The companion skill of Vercel's open-source skills CLI and the most-installed skill on skills.sh. Once installed, just say \"I want to do X\" and the agent searches the open skills.sh directory for suitable skills and installs them for you.","features":["Search for skills by describing your need in plain language","Install with a single npx skills add command","The skills CLI supports dozens of agents incl. Claude Code, Codex, Cursor and OpenCode","Helps you choose by install count and source"],"useCases":["New to agents and unsure which skills to install","Finding a ready-made skill for a new task","Managing skills consistently across a team"],"pros":["One skill that leads you to all the others","Officially maintained, simplest install"],"cons":["Recommendation quality depends on skill descriptions in the directory","Still check third-party skills yourself before installing"],"tip":"Before installing a third-party skill, open its SKILL.md and make sure there are no suspicious instructions."}},
"grill-me":{"s":"Has the AI grill you about your plan one question at a time, like a strict reviewer, until nothing is missed.","d":{"intro":"The most popular skill in TypeScript educator Matt Pocock's library and the most-installed third-party skill on skills.sh. Run /grill-me and the AI asks about your plan or design one question at a time, walking every branch of the decision tree; facts it can find in code or docs it looks up itself instead of asking you. It finishes only when every branch is covered and no hidden assumptions remain.","features":["One question at a time, going deeper each round","Walks every branch of the decision tree, leaving no hidden assumptions","Looks up what it can and only asks what you must decide","Sister skill grill-with-docs writes docs as it asks"],"useCases":["Clarifying requirements before a new feature or product","Mapping the Q&A flow before building an interview-style program","Stress-testing big decisions"],"pros":["Short and general-purpose, not limited to coding","Surfaces most overlooked issues before you start"],"cons":["Lots of questions; answering takes patience","Must be triggered manually with /grill-me"],"tip":"Use grill-me to pin down requirements first, then hand the conclusions to Cursor or Claude Code; you will redo far less."}},
"grill-with-docs":{"s":"grill-me plus: writes a glossary and architecture decisions into docs while it questions you.","d":{"intro":"Another popular skill from Matt Pocock's library, roughly grill-me plus domain-modeling. While questioning your plan one item at a time, the AI writes agreed terms into GLOSSARY.md and records key decisions as ADRs (architecture decision records), so later agents and colleagues use the same language.","features":["The same one-question-at-a-time grilling as grill-me","Live updates to the project glossary GLOSSARY.md","Records key decisions as ADRs","Challenges vague wording and builds edge cases"],"useCases":["Aligning requirements and terms at project kickoff","Design discussions for complex business systems","Leaving a traceable decision trail for later development"],"pros":["Discussion results are captured as documentation automatically","Reduces misunderstandings between the team and the AI"],"cons":["Heavier than grill-me; suited to real projects","Adds documentation files to your project"],"tip":"Use grill-me for small personal ideas and grill-with-docs for collaborative or long-lived projects."}},
"agent-browser":{"s":"A browser-automation CLI designed for AI agents, plus its companion skill.","d":{"intro":"Vercel Labs' open-source browser-automation CLI (Apache-2.0), with a companion skill that teaches agents how to use it. Agents open pages, read structural snapshots, click and type through short commands, so coding agents can verify web pages or complete tasks on them.","features":["Browser commands: open, navigate, click, type, screenshot","Page structure snapshots; agents act on element references","Works with Claude Code, Codex, Cursor and other coding agents","CLI form that is easy to script"],"useCases":["Letting the AI check that the page it built actually works","Scraping web data and filling forms","End-to-end testing"],"pros":["Built for agents: concise output that saves context","Maintained by Vercel and actively updated"],"cons":["Cannot handle CAPTCHAs or other human checks","Needs a local browser environment"],"tip":"After building a frontend, have the agent walk through the main flows with it; many issues surface before delivery."}},
"hyperframes":{"s":"Write scenes in HTML and render them to video, so AI can make animated shorts and promos.","d":{"intro":"HeyGen's open-source \"write HTML, render to video\" framework (Apache-2.0), built for AI agents, with about 69k GitHub stars. Its skills teach the AI to build each scene with HTML, CSS and GSAP animation and render it to a video file. Several hyperframes skills each have about 1M installs on skills.sh.","features":["Describe video scenes with HTML and CSS","GSAP animation and keyframe control","Add audio, captions and other media","One-command rendering to video"],"useCases":["Product promos and feature demos","Data animations and explainer videos","Batch-producing social media shorts"],"pros":["AI is good at web code, so scenes are controllable and easy to revise","Video source can be version-controlled and batch-generated"],"cons":["Needs local Node.js and a render environment","Not for editing live-action footage"],"tip":"Have the AI make a 10-second sample to settle style and pacing before expanding to a full video."}},
"improve-codebase-architecture":{"s":"Scans the codebase for modules to \"deepen\", produces a visual report, then grills you on each item.","d":{"intro":"Matt Pocock's architecture-improvement skill. It scans the codebase for friction points and proposes \"deepening\" opportunities — refactoring shallow modules with complex interfaces and thin contents into deep modules with simple interfaces and complete functionality — so code is easier to test and easier for AI to understand. Results come as a visual HTML report; pick an item and it grills you to settle the plan.","features":["Finds architectural friction and refactoring opportunities automatically","Generates a visual HTML report","Uses a shared design vocabulary (module, interface, depth, seam…)","Refines the chosen direction through questioning"],"useCases":["Paying down tech debt in older projects","Restructuring when AI edits keep making a mess","Improving testability"],"pros":["Concrete, actionable refactoring advice","Clear report that is easy to discuss as a team"],"cons":["Best for codebases of some size","The refactor itself still needs human oversight"],"tip":"Finish one refactor and get tests passing before coming back for the next."}},
"tdd":{"s":"Test-driven development skill: the AI writes tests first, then code that makes them pass.","d":{"intro":"Matt Pocock's test-driven development skill. It makes the AI work in a red → green loop: write a failing test, then just enough code to pass it. It spells out what good tests are, where they belong and common anti-patterns, so the AI writes tests worth keeping.","features":["Red-green development loop","Tests behavior through public interfaces, not implementation details","Test names follow the project glossary","Lists common testing anti-patterns to avoid"],"useCases":["Writing tests alongside new features","Writing a reproducing test before fixing a bug","Making AI-generated code more reliable"],"pros":["Clearly better test quality","Fewer regressions from AI code changes"],"cons":["Development feels a bit slower","Requires an existing test framework"],"tip":"Say \"fix this bug with TDD\" and it will first write a test that reproduces the problem."}},
"frontend-design":{"s":"Anthropic's official skill for distinctive, non-generic frontend design.","d":{"intro":"The most-installed skill in Anthropic's official library. It has the AI commit to a clear aesthetic direction before writing frontend code, then make intentional choices about type, color, layout and motion, avoiding generic \"AI-looking\" template pages.","features":["Picks a design direction (minimal, retro, editorial…) before coding","Font pairing and color systems","Layout, motion and detail polish","Works for pages, components and full sites"],"useCases":["Landing pages and personal sites","Product UI prototypes","Making AI-generated pages more distinctive"],"pros":["Official, with leading installs","Noticeably less same-looking design"],"cons":["Visual focus; does not handle business logic","Style can be bold; tone it down for formal contexts"],"tip":"Tell it the target audience and the vibe you want (e.g. \"for a law firm, sober\"); far better than \"make it pretty\"."}},
"handoff":{"s":"Compresses the current conversation into a handoff doc so an agent in a new session can pick up seamlessly.","d":{"intro":"Compresses the current conversation into a handoff document saved to the system temp folder so an agent in a new session can continue. It lists skills the next agent should use, references existing specs, plans and commits instead of copying them, and redacts API keys and other secrets. About 1.02M installs on skills.sh.","features":["Generates a handoff doc with one command","Lists skills the next agent should use","References existing docs, issues and commits without duplication","Redacts keys and personal information automatically"],"useCases":["Switching sessions when context is nearly full","Passing a task to another agent or colleague","Saving progress at the end of the day"],"pros":["Switch sessions without losing progress","Concise doc with only key information"],"cons":["Must be triggered manually","Quality depends on how clear the original conversation was"],"tip":"Add \"what to do next\" when you run it for a more targeted handoff."}},
"triage":{"s":"Triages issues and external PRs: classify, verify, and write agent-ready task briefs.","d":{"intro":"Processes issues and external PRs through a triage flow: classify, check reproducibility, fill gaps by asking questions, and finally write a task brief a coding agent can execute. Every comment it posts on an issue is labeled as AI-generated. About 970k installs on skills.sh.","features":["Moves issues and PRs through states step by step","Classifies and checks reproducibility","Asks follow-up questions when information is missing","Outputs task briefs for agents"],"useCases":["Open-source projects drowning in issues","Team bug management","Cleaning up a problem before handing it to a coding agent"],"pros":["Standardized, traceable process","Output can go straight to an agent"],"cons":["Requires setup-matt-pocock-skills to configure your issue tracker","Best for projects with a fair number of issues"],"tip":"Run it once a day to turn new issues into briefs, then hand the high-priority ones to an agent."}},
"prototype":{"s":"Builds throwaway prototypes to answer design questions: verify logic or compare several UIs side by side.","d":{"intro":"Builds throwaway prototypes to answer design questions. For logic, it creates a shareable HTML file with buttons and step-through demos of state changes; for UI, it generates several very different designs on one page and switches between them with URL parameters. About 970k installs on skills.sh.","features":["Logic prototypes: walk through complex states and flows in HTML","UI prototypes: several very different designs at once","Non-developers can operate the prototype directly","Kept separate from production code"],"useCases":["Validating logic when business flows are complex","Discussing UI direction with clients or bosses","Cheap experiments before building"],"pros":["Something clickable very quickly","Side-by-side options speed up decisions"],"cons":["Prototype code is not production-ready","You need to know what question you want answered"],"tip":"Ask for 3 very different UI options at once; it finds the direction faster than tweaking one."}},
"domain-modeling":{"s":"Builds a domain model while you design: maintains a glossary and records architecture decisions.","d":{"intro":"Actively builds and refines the project's domain model during design: questions vague wording, constructs edge cases, writes agreed terms into GLOSSARY.md and records key decisions as ADRs. It is what grill-with-docs calls while grilling. About 860k installs on skills.sh.","features":["Maintains the project glossary GLOSSARY.md","Records key decisions as ADRs","Flags inconsistent terminology","Builds edge cases to test the design"],"useCases":["Designing complex business systems","Aligning terminology between team and AI","Giving coding agents accurate business context"],"pros":["Ends the \"one thing, five names\" confusion","Decisions are recorded and traceable"],"cons":["Adds documentation files to the project","Heavy for small projects"],"tip":"Start the glossary at project kickoff; later skills (tdd, code-review…) will all refer to it."}},
"vercel-react-best-practices":{"s":"Vercel's official React / Next.js performance rules, ranked by impact.","d":{"intro":"Vercel's official React and Next.js performance skill, distilling years of team experience into dozens of rules ranked by impact, such as eliminating request waterfalls and shrinking bundle size. About 826k installs on skills.sh.","features":["React / Next.js performance rules ranked by impact","Focus on request waterfalls and bundle size","Useful for writing new code and reviewing old code","Works with Claude Code, Cursor and other agents"],"useCases":["Next.js code review","Speeding up page loads","Guarding AI-generated frontend code"],"pros":["Experience from a frontline framework team","Concrete rules you can apply directly"],"cons":["Only for React / Next.js","Some rules need project-specific judgment"],"tip":"Have the AI audit an existing project against these rules; it usually finds a few obvious slow spots."}},
"superpowers":{"s":"Senior-engineer workflows as skills: brainstorming, planning, TDD, debugging, review.","d":{"intro":"An agent-skills framework and software methodology from developer Jesse Vincent (obra), with over 300k GitHub stars — one of the most-starred skill projects. It encodes senior-engineer habits as skills: brainstorm and plan first, then proceed with TDD, systematic debugging and code review.","features":["Full brainstorm → write plan → execute plan flow","Test-driven development (TDD) skill","Systematic debugging and root-cause analysis","Parallel subagent development and code review"],"useCases":["Building mid-to-large features with Claude Code and other agents","Keeping AI coding from drifting off course","Standardizing team AI coding practices"],"pros":["Clearly more reliable AI coding","Clear process you can trim to taste"],"cons":["Heavy process; overkill for small changes","Needs some engineering experience to use well"],"tip":"Start with the \"writing plans\" and \"systematic debugging\" skills; they pay off the most."}},
"web-design-guidelines":{"s":"Reviews pages against web interface guidelines: accessibility, interaction details and UX issues.","d":{"intro":"Vercel's official skill that reviews pages against a set of web interface guidelines, checking easily missed UX issues in accessibility, interaction details, forms, motion and typography. About 768k installs on skills.sh.","features":["Checks pages item by item against web interface guidelines","Accessibility: keyboard use, contrast, screen-reader support","Interaction details: loading states, error messages, form behavior","Gives concrete fix suggestions"],"useCases":["A UI health check before launch","Checking the quality of AI-generated pages","Aligning team frontend UX standards"],"pros":["Broad coverage with fine detail","Frontline experience from Vercel"],"cons":["Review-focused; not about visual style","Many rules; small projects can pick the key ones"],"tip":"After building a page, say \"review this page with web-design-guidelines\" and let the AI fix items one by one."}},
"remotion":{"s":"Remotion's official skills for making video with React: best practices, captions, rendering.","d":{"intro":"Remotion's official skill collection. Remotion is a framework for making videos with React; these skills teach the AI to do animation, captions and rendering in code, ideal for batch data videos and product videos. The main skill remotion-best-practices has about 650k installs on skills.sh.","features":["Remotion best practices and common pitfalls","Specialized skills for captions, animation, maps and more","Local and cloud rendering","Version upgrade guidance"],"useCases":["Product intro and feature demo videos","Data-visualization videos","Batch personalized videos"],"pros":["Video in code: easy to revise and batch-generate","Officially maintained in sync with the framework"],"cons":["Requires some React knowledge","Not for editing live-action footage"],"tip":"Have the AI build a 10-second template with remotion-best-practices, confirm it, then batch-swap the content."}},
"taste-skill":{"s":"Gives coding agents \"taste\": art direction, references and browser checks — no more AI template pages.","d":{"intro":"Helps coding agents build tasteful frontends: art direction and reference images first, then a browser check of the result, avoiding generic AI template pages. About 100k GitHub stars; the main skill design-taste-frontend has about 650k installs on skills.sh.","features":["Settles art direction and references before designing","Specialized skills for landing pages, portfolios and more","Self-checks with browser screenshots when done","Avoids common \"AI-looking\" palettes and layouts"],"useCases":["Product landing pages","Personal portfolio sites","Marketing pages that need to stand out"],"pros":["Clearly better visual quality","Includes checking, not just generation"],"cons":["Visual focus; complex logic needs other skills","Needs an environment that can run a browser"],"tip":"Give it one or two sites you like as references to get closer to the style you want."}},
"caveman":{"s":"Makes coding agents reply in terse \"caveman\" speak, claiming ~65% token savings.","d":{"intro":"Makes coding agents reply in minimal \"caveman\" language, claiming to save about 65% of tokens. About 114k GitHub stars and 580k installs of the main skill on skills.sh; one of the most-watched money-saving skills lately.","features":["Strips pleasantries and repeated explanations","Keeps code and key information","Can pair with a proxy for further compression","Several intensity levels"],"useCases":["Saving quota in long coding sessions","API users paying per token","Developers who only want conclusions"],"pros":["Noticeable savings","Shorter replies that are easy to scan"],"cons":["Too terse for beginners","Not suitable for docs or public-facing content"],"tip":"Turn it on only for coding sessions; switch it off when writing docs or reports."}},
"azure-skills":{"s":"Microsoft's official Azure skills: deployment, diagnostics, storage, AI services and more.","d":{"intro":"Microsoft's official Azure skills plugin with dozens of skills for deployment, diagnostics, storage, AI services, cost and quotas, plus matching MCP config, so coding agents can operate Azure directly. Its top skill has about 570k installs on skills.sh.","features":["One-step app deployment to Azure","Diagnostics and log analysis","Managing storage, databases, Kubernetes and more","Azure AI Foundry and AI service setup"],"useCases":["Deploying apps to Azure","Troubleshooting production services","Managing enterprise cloud resources"],"pros":["Officially maintained by Microsoft","Covers most common Azure services"],"cons":["Azure only","Needs an Azure account and permissions"],"tip":"Have the agent run \"azure-prepare\" to check the environment before deploying; it avoids many pitfalls."}},
"ui-ux-pro-max":{"s":"Design knowledge for cross-platform UI/UX: styles, palettes, fonts and component guidelines.","d":{"intro":"A design knowledge base for UI/UX across platforms: dozens of styles, color palettes, font pairings and component guidelines, so the AI picks a design direction before building the interface. About 138k GitHub stars; the main skill has about 410k installs on skills.sh.","features":["Many ready-made UI styles and palettes","Font pairing and typography guidelines","Works for web, mobile apps and more","Recommends design directions by product type"],"useCases":["Designing a site or app UI from scratch","Developers without design skills making pro interfaces","Quickly comparing visual styles"],"pros":["Rich style library with lots of choice","Cross-platform"],"cons":["Many options; you have to choose","Results still need brand tuning"],"tip":"Tell it the product type and audience first and ask for 2–3 style recommendations to choose from."}},

"ponytail":{"s":"Makes the AI think like \"the laziest senior engineer\": the best code is code never written.","d":{"intro":"Makes the AI think like \"the laziest senior engineer in the room\": the best code is the code you never wrote. It constrains coding agents with YAGNI (you aren't gonna need it) to cut over-engineering and unnecessary code. About 170k GitHub stars, with 6 skills.","features":["Checks whether code is really needed before writing it","Prefers reusing existing code and mature libraries","Refuses to pre-design for \"might need it later\"","Keeps every change as small as possible"],"useCases":["When AI writes too much, too complex code","Keeping small projects light","Setting a \"less is more\" coding style for a team"],"pros":["Clearly less code and maintenance","Combines well with other coding skills"],"cons":["Can be overly conservative until you ask it to expand","Not for infrastructure that needs built-in extensibility"],"tip":"Pair it with the Karpathy coding guidelines; the AI's edits become more restrained and easier to review."}},

"karpathy-guidelines":{"s":"A single CLAUDE.md that constrains agents based on Karpathy's observations of AI coding flaws.","d":{"intro":"A project consisting of just one CLAUDE.md, based on Andrej Karpathy's observations of common LLM coding mistakes, with about 220k GitHub stars. It asks coding agents to think before acting, prefer simple solutions, change only what was requested, and work toward verifiable goals.","features":["Think first, state assumptions, ask when unsure","Simplicity first; no code that is not needed","Surgical edits; do not touch unrelated code","Driven by verifiable goals with a self-check at the end"],"useCases":["When AI keeps over-editing or over-engineering","Setting a shared AI coding baseline for a team","Fewer disasters for beginners using coding agents"],"pros":["Just one file, zero learning curve","Works with every coding agent"],"cons":["Behavior rules only; adds no capabilities","Must be merged with your project's own rules"],"tip":"Put it in the same CLAUDE.md or AGENTS.md as your project rules so they don't contradict each other."}},

"ecc":{"s":"A huge agent config bundle: skills, subagents, memory and security rules all included.","d":{"intro":"affaan-m's open-source agent \"performance system\", formerly Everything Claude Code, with about 285k GitHub stars. It bundles many skills, subagents, commands, hooks, memory mechanisms and security rules, usable with Claude Code, Codex, OpenCode, Cursor and more.","features":["Skills and subagents for planning, coding, testing and review","Continuously learning \"instincts\" and memory","Security checks and guard rules","Research-first development workflow"],"useCases":["Equipping a coding agent with common abilities in one go","Studying a mature agent setup","Building a shared AI dev environment for a team"],"pros":["Comprehensive and ready to use","Active community, frequent updates"],"cons":["Large; installing everything eats a lot of context","Takes time to pick the parts you need"],"tip":"Don't install it all at once; start with a few parts that match your stack."}},

      if (/^[一-鿿]+$/.test(run)){ for (let i = 0; i < run.length - 1; i++) set.add(run.slice(i, i + 2)); }
      else if (run.length >= 2) set.add(run);
    }
    return [...set];
  }
  function search(s){
    const toks = tokens(s), ints = intents(s);
    if (!toks.length && !ints.length) return [];
    return items.concat(hotOnly()).map(it => {
      const e = enOf(it), ed = e.d;
      const strong = normalize(it.name + " " + (it.kw || ""));
      const weak = normalize([it.summary, e.s || enHot(it.id).s, it.category, (EN.cat || {})[it.category], it.maker].join(" "));
      const deep = normalize(it.details ? [it.details.intro].concat(it.details.useCases || [], it.details.features || [], ed ? [ed.intro].concat(ed.useCases || [], ed.features || []) : []).join(" ") : "");
      let sc = 0; const hit = [];
      for (const k of toks){
        if (strong.includes(k)){ sc += 2; hit.push(k); }
        else if (weak.includes(k)){ sc += 1; hit.push(k); }
        else if (deep.includes(k)) sc += 0.5;
      }
      let b = 0;
      for (const x of ints){ const k = (it.type === "工具" ? x.tool : x.skill).indexOf(it.category); if (k === 0) b = Math.max(b, 4); else if (k > 0) b = Math.max(b, 3); }
      return { it, s: sc + b, hit, cat: b > 0 };
    }).filter(r => r.s >= 2).sort((a, b) => b.s - a.s || (b.it.details ? 1 : 0) - (a.it.details ? 1 : 0) || (b.it.score || 0) - (a.it.score || 0));
  }

    $("cmpBody").innerHTML = '<table class="cmp"><thead><tr><th></th>'+its.map(i => '<th>'+esc(nm(i))+'</th>').join("")+'</tr></thead><tbody>'+
      rowsDef.map(([k, f]) => '<tr><th>'+k+'</th>'+its.map(i => '<td>'+f(i)+'</td>').join("")+'</tr>').join("")+'</tbody></table>'+
      (its.some(i => !i.details) ? '<p class="muted" style="font-size:12px;padding:8px 10px">'+t("cmpPartial")+'</p>' : '');
    $("cmpModal").hidden = false;
  }

  /* ---------- 操作 ---------- */
  function select(id){
    const it = findAny(id); if (!it) return;
    if (view !== "收藏" && it.type !== view){ view = it.type; cat = ""; save(); }
    if (view !== "收藏"){ if (it.hotOnly) hotView = true; else if (!hotView && cat && it.category !== cat) cat = ""; if (!priceOk(it)) price = ""; }
    sel = it; q = ""; $("q").value = "";
    renderList(); renderDetail();
    const r = document.querySelector('.row[data-id="'+CSS.escape(id)+'"]');
    if (r && !mobile()) r.scrollIntoView({ block: "nearest" });
    openSheet();
  }
  function openSheet(){ if (mobile()){ $("side").classList.add("open"); document.body.style.overflow = "hidden"; } }
  function closeSheet(){ $("side").classList.remove("open"); document.body.style.overflow = ""; }
  function save(){ store.set("ai100-view", view); }
  let tt; function toast(m){ const el = $("toast"); el.textContent = m; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2000); }
  function copy(text, ok){ if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast(ok), () => toast(t("copyFail"))); else toast(t("copyFail")); }

  /* 静态文字：data-i（内容）、data-i-ph（placeholder）、data-i-al（aria-label）、data-i-ti（title） */
  function applyStatic(){
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
    document.querySelectorAll("[data-i-ph]").forEach(el => { el.placeholder = t(el.dataset.iPh); });
    document.querySelectorAll("[data-i-al]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.iAl)); });
    document.querySelectorAll("[data-i-ti]").forEach(el => { el.title = t(el.dataset.iTi); });
    document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
    $("cur").value = cur;
    paintTheme();
  }
  function rerender(){
    applyStatic();
    if (!data) return;
    renderMeta(); renderList(); renderTray();
    if (q) renderSearch(); else renderDetail();
    if (!$("cmpModal").hidden) openCompare();
  }
  function setLang(l){
    if (!LANGS.includes(l)) return;
    lang = l; li = LANGS.indexOf(l); store.set("ai100-lang", l);
    if (l === "zh-Hant") loadCC();
    rerender();
  }

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    if (view === b.dataset.view) return;
    view = b.dataset.view; cat = ""; price = ""; hotView = false; save(); closeSheet();
    if (view === "工具" || view === "技能") sel = pool()[0] || null;
    else if (view === "收藏") sel = favItems()[0] || null;
    q = ""; $("q").value = "";
    renderList(); renderDetail();
  }));
  $("langSeg").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });
  $("cur").addEventListener("change", e => { cur = e.target.value; store.set("ai100-cur", cur); rerender(); });
  $("chips").addEventListener("click", e => {
    const h = e.target.closest("[data-hot]"); if (h){ hotView = !hotView; cat = ""; renderList(); return; }
    const c = e.target.closest("[data-cat]"); if (c){ hotView = false; cat = c.dataset.cat; renderList(); }
  });
  $("price").addEventListener("change", e => { price = e.target.value; renderList(); });
  $("sort").addEventListener("change", e => { sortBy = e.target.value; renderList(); if (!q) renderDetail(); });
  let timer;
  $("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { q = e.target.value.trim(); renderSearch(); }, 150); });
  $("q").addEventListener("focus", () => { if (!q) renderSearch(); });
  $("q").addEventListener("keydown", e => { if (e.key === "Enter"){ clearTimeout(timer); q = e.target.value.trim(); renderSearch(); if (sample && q) askAI(); } if (e.key === "Escape"){ q = ""; e.target.value = ""; e.target.blur(); renderDetail(); } });
  $("aiBtn").addEventListener("click", () => { q = $("q").value.trim(); if (!q){ toast(t("needQ")); $("q").focus(); return; } renderSearch(); askAI(); });
  $("back").addEventListener("click", closeSheet);
  $("methodBtn").addEventListener("click", () => { $("methodModal").hidden = false; });
  $("cmpClear").addEventListener("click", () => { cmp = []; store.set("ai100-cmp", cmp); renderTray(); $("cmpModal").hidden = true; if (sel) renderDetail(); });
  document.querySelectorAll(".modal-bg").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.hidden = true; }));
  document.addEventListener("keydown", e => { if (e.key === "Escape"){ document.querySelectorAll(".modal-bg").forEach(m => m.hidden = true); closeSheet(); } });
  document.addEventListener("click", e => {
    const el = e.target;
    const cl = el.closest("[data-close]"); if (cl){ $(cl.dataset.close).hidden = true; return; }
    const cp = el.closest("[data-copy]"); if (cp){ copy(cp.dataset.copy, t("copiedCmd")); return; }
    const pv = el.closest("[data-play]"); if (pv){ const v = pv.dataset.play; if (/^[\w-]{11}$/.test(v)) pv.outerHTML = '<iframe class="sc-frame" src="https://www.youtube-nocookie.com/embed/'+v+'?autoplay=1&rel=0" title="'+esc(pv.dataset.title || "")+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>'; return; }
    const fv = el.closest("[data-fav]"); if (fv){ toggleFav(fv.dataset.fav); toast(favs.includes(fv.dataset.fav) ? t("favAdded") : t("favRemoved")); renderList(); renderDetail(); return; }
    const uf = el.closest("[data-unfav]"); if (uf){
      const id = uf.dataset.unfav; favs = favs.filter(x => x !== id); store.set("ai100-fav", favs); toast(t("favRemoved"));
      if (view === "收藏" && sel && sel.id === id) sel = favItems()[0] || null;
      renderList(); if (!q) renderDetail(); return; }
    if (el.closest("[data-unfavall]")){
      if (!el.closest("[data-unfavall]").dataset.confirm){ const b = el.closest("[data-unfavall]"); b.dataset.confirm = "1"; b.textContent = t("confirm"); setTimeout(() => { if (b.isConnected){ b.dataset.confirm = ""; b.textContent = t("clearAll"); } }, 3000); return; }
      favs = []; store.set("ai100-fav", favs); toast(t("favCleared")); if (view === "收藏") sel = null; renderList(); if (!q) renderDetail(); return; }
    const cm = el.closest("[data-cmp]"); if (cm){ if (toggleCmp(cm.dataset.cmp)) renderDetail(); return; }
    const uc = el.closest("[data-uncmp]"); if (uc){ toggleCmp(uc.dataset.uncmp); if (!q) renderDetail(); return; }
    if (el.closest("#cmpGo")){ openCompare(); return; }
    const ex = el.closest("[data-ex]"); if (ex){ $("q").value = ex.dataset.ex; q = ex.dataset.ex; renderSearch(); return; }
    if (el.closest("#clearQ")){ q = ""; $("q").value = ""; renderDetail(); return; }
    const st = el.closest("[data-step]");
    if (st && sel){ const l = view === "收藏" ? favItems() : sorted(items.filter(i => i.type === sel.type).sort((a, b) => a.rank - b.rank)); const i = l.findIndex(x => x.id === sel.id) + Number(st.dataset.step); if (l[i]) select(l[i].id); return; }
    const r = el.closest("[data-id]"); if (r) select(r.dataset.id);
  });

  /* ---------- 载入数据 ---------- */
  function renderMeta(){
    $("updated").textContent = t("updated", data.updatedTime || data.updatedAt || "—");
    $("edition").textContent = t("edition", data.edition || 1);
    $("n-tool").textContent = items.filter(i => i.type === "工具").length;
    $("n-skill").textContent = items.filter(i => i.type === "技能").length;
    $("method").textContent = (isEn() ? EN.method : tx(data.method)) || "—";
    const srcEn = EN.sources || [];
    $("sources").innerHTML = (data.sources || []).map((s, i) => '<li><a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener">'+esc(isEn() && srcEn.length === data.sources.length ? srcEn[i] : tx(s.name))+'</a></li>').join("") || "<li>—</li>";
    $("log").innerHTML = (data.changelog || []).slice().reverse().slice(0, 8).map(c => '<li><span class="mono">'+esc(c.date)+'</span> '+esc(logN(c.note))+'</li>').join("") || "<li>—</li>";
  }
  function useData(nd, first){
    data = nd; items = data.items || [];
    let deep = null;
    if (first){
      const h = (location.hash || "").replace("#", "");
      const sv = store.get("ai100-view", "工具");
      view = ["工具", "技能", "收藏"].includes(sv) ? sv : "工具";
      if (h === "tools") view = "工具"; else if (h === "skills") view = "技能";
      deep = h && findAny(h);
      if (deep){ view = deep.type; if (deep.hotOnly) hotView = true; sel = deep; }
    }
    if (sel) sel = findAny(sel.id) || null;
    if (!sel) sel = (view === "收藏" ? favItems()[0] : (view === "工具" || view === "技能") ? pool()[0] : null) || null;
    renderMeta(); renderList(); renderTray();
    if (q) renderSearch(); else renderDetail();
    if (deep && mobile()) openSheet();
  }
  applyStatic();
  if (lang === "zh-Hant") loadCC();
  const stamp = x => String(x.updatedTime || x.updatedAt || "");
  const embedded = readJson("ranking-data");
  if (embedded && embedded.items) useData(embedded, true);
  else { $("rows").innerHTML = '<div class="empty">'+t("loadFail")+'</div>'; $("updated").textContent = t("notLoaded"); }
  (async () => {
    const claude = window.claude;
    if (!claude || !claude.use) return;
    claude.use("sample").then(s => { sample = s; $("aiBtn").hidden = !s; }).catch(() => {});
    const db = await claude.use("db").catch(() => null);
    if (!db) return;
    db.doc("ranking/current").onSnapshot(snap => {
      if (!snap.exists) return;
      const nd = snap.data();
      if (nd && nd.items && (!data || stamp(nd) > stamp(data))) useData(nd, false);
    }, () => {});
  })();
})();
</script>

</body></html>
