<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>全球 AI 工具与技能 TOP100</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 页首（标题＋更新时间）→ 工具列（榜单切换＋搜索）→ 两栏「榜单 | 详情或推荐」；手机版单栏，详情以全屏面板打开 */
:root{
  --bg:#f3f2ee; --panel:#ffffff; --panel-2:#f7f6f2; --line:#e6e3dc; --ink:#1d1c1a; --muted:#87837a;
  --pill:#3b3a37; --pill-ink:#ffffff; --accent:#e2611c; --quote:#4b6bd6; --hover:#ecebe5;
  --ok:#2f8f5b; --ok-soft:#e3f2e8; --warn:#b97c0c; --warn-soft:#fbf0d6; --wait:#3d74c9; --wait-soft:#e8eef9;
  --bad:#d23b2e; --bad-soft:#fbe7e4; --idle-soft:#efede8; --scrim:rgba(29,28,26,.38);
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans TC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1917; --panel:#23221f; --panel-2:#2a2925; --line:#36342f; --ink:#ecebe6; --muted:#9a968c;
  --pill:#e9e7e1; --pill-ink:#1a1917; --accent:#f07a37; --quote:#7f9cf0; --hover:#302e2a;
  --ok:#3fa86f; --ok-soft:#1f3328; --warn:#c98f22; --warn-soft:#3a3020; --wait:#5f8fdf; --wait-soft:#1f2a3d;
  --bad:#e0503f; --bad-soft:#41231f; --idle-soft:#2b2a26; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1917; --panel:#23221f; --panel-2:#2a2925; --line:#36342f; --ink:#ecebe6; --muted:#9a968c;
  --pill:#e9e7e1; --pill-ink:#1a1917; --accent:#f07a37; --quote:#7f9cf0; --hover:#302e2a;
  --ok:#3fa86f; --ok-soft:#1f3328; --warn:#c98f22; --warn-soft:#3a3020; --wait:#5f8fdf; --wait-soft:#1f2a3d;
  --bad:#e0503f; --bad-soft:#41231f; --idle-soft:#2b2a26; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--quote);outline-offset:2px}
a{color:var(--quote)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.app{display:flex;flex-direction:column;height:100%;max-width:1440px;margin:0 auto}

/* 页首 */
.ph{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding-block:18px 10px;flex:none}
.ph h1{margin:0;font-size:20px;display:flex;gap:10px;align-items:center}
.ph h1 .sq{width:18px;height:18px;background:var(--accent);border:2px solid var(--ink);border-radius:3px;flex:none}
.meta{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.meta .live{display:inline-flex;align-items:center;gap:6px}
.meta .live i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.linkbtn{border:0;background:none;padding:0;color:var(--quote);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}

/* 工具列 */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:4px 14px;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);flex:none}
.seg button{border:0;background:none;padding:8px 16px;font-size:14px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-selected="true"]{background:var(--pill);color:var(--pill-ink);font-weight:700}
.seg button .n{font-family:var(--mono);font-size:11px;opacity:.7}
.search{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:3px 3px 3px 12px}
.search:focus-within{border-color:var(--quote)}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px;padding:6px 0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.dark{background:var(--pill);color:var(--pill-ink);border-color:var(--pill)}
.btn.dark:hover:not(:disabled){opacity:.88;background:var(--pill)}
.btn.sm{padding:3px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}

/* 两栏 */
.body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:14px;padding-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}

/* 筛选 */
.filters{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip:hover{color:var(--ink);background:var(--hover)}
.chip .mono{font-size:11px;margin-left:2px}
.chip[aria-pressed="true"]{background:var(--pill);border-color:var(--pill);color:var(--pill-ink);font-weight:700}
.chip.hotchip{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.chip.hotchip[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.filters select{flex:none;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:4px 8px;font-size:12.5px}

/* 榜单 */
.rows{flex:1;overflow-y:auto;min-height:0}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 66px 70px;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px 10px 12px;box-shadow:inset 3px 0 0 var(--edge,transparent)}
.row:hover{background:var(--panel-2)}
.row[aria-current="true"]{background:var(--wait-soft);--edge:var(--wait)}
.row.top3{--edge:var(--accent)}
.row.top3[aria-current="true"]{--edge:var(--accent)}
.head{position:sticky;top:0;z-index:1;background:var(--panel-2);font-size:11px;color:var(--muted);letter-spacing:.06em;padding-block:6px;cursor:default}
.head:hover{background:var(--panel-2)}
.rk{font-family:var(--mono);font-weight:700;font-size:15px;display:grid;line-height:1.2}
.row.top3 .rk{color:var(--accent)}
.mv{font-size:10px;font-weight:700}
.mv.up{color:var(--bad)} .mv.down{color:var(--ok)} .mv.new{color:var(--bad)}
.nm{min-width:0;display:grid;gap:1px}
.nm b{font-size:14.5px;display:flex;gap:6px;align-items:baseline;min-width:0}
.nm b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot-dot{flex:none;font-size:10.5px;font-weight:700;color:var(--bad)}
.pr{font-size:12px;font-weight:500;white-space:nowrap}
.pr.free{color:var(--ok)} .pr.fm{color:var(--wait)} .pr.paid{color:var(--warn)}
.sc{display:grid;gap:4px;justify-items:end}
.sc b{font-family:var(--mono);font-size:13px;font-weight:500}
.meter{width:100%;height:3px;border-radius:99px;background:var(--idle-soft);overflow:hidden}
.meter i{display:block;height:100%;background:var(--tc,var(--wait))}
.row.top3 .meter i{background:var(--accent)}
.skillboard{--tc:#16907f}
.empty{margin:auto;color:var(--muted);font-size:13px;text-align:center;padding:28px 12px}

/* 右栏：详情 / 推荐 */
.side .top{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);flex:none}
.side .top .ttl{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.side .top .back{display:none}
.rnav{display:flex;gap:4px}
.rnav button{border:1px solid var(--line);background:var(--panel);border-radius:7px;width:28px;height:26px}
.rnav button:disabled{opacity:.35}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:16px 18px 22px;display:flex;flex-direction:column;gap:16px}
.scroll>*{flex:none}

.d-name{margin:0;font-size:22px;line-height:1.25;text-wrap:balance}
.d-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{padding:8px 12px;display:grid;gap:1px}
.stats div+div{border-left:1px solid var(--line)}
.stats span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.stats b{font-size:17px;font-family:var(--mono)}
.stats b.txt{font-family:var(--sans);font-size:15px}
.basis{font-size:12px;color:var(--muted);margin-top:-8px}
.note{border-radius:9px;padding:8px 12px;font-size:13px;display:flex;gap:8px}
.note b{white-space:nowrap}
.note.hot{background:var(--bad-soft);color:var(--ink)} .note.hot b{color:var(--bad)}
.note.tip{background:var(--warn-soft)} .note.tip b{color:var(--warn)}
.intro{margin:0;font-size:14px;line-height:1.75}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.sec h3{margin:0 0 5px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.08em}
.sec ul{margin:0;padding-left:1.1em;font-size:13.5px;display:grid;gap:3px}
.sec p{margin:0;font-size:13.5px}
.sec.pros li::marker{color:var(--ok)} .sec.cons li::marker{color:var(--bad)}
.code{display:flex;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:6px 6px 6px 10px}
.code code{flex:1;min-width:0;font-family:var(--mono);font-size:12px;overflow-x:auto;white-space:nowrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.thin{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:9px;padding:8px 12px}

/* 推荐 */
.intent{font-size:13px;background:var(--wait-soft);border-radius:9px;padding:8px 12px}
.intent b{color:var(--quote)}
.grp{display:grid;gap:6px}
.grp h3{margin:0;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.08em}
.res{display:grid;gap:2px;text-align:left;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 12px}
.res:hover{background:var(--panel-2)}
.res .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.res .l1 b{font-size:14px}
.res .l1 .rkt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.res .l2{font-size:12.5px;color:var(--muted)}
.res .why{font-size:12px;color:var(--ink)}
.res.ai{border-color:var(--quote)}
.ex{display:flex;flex-wrap:wrap;gap:6px}

/* 弹窗与提示 */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:60}
.modal{max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(680px,100%);padding:18px;display:grid;gap:10px}
.modal h3{margin:0;font-size:17px}
.modal h4{margin:6px 0 0;font-size:13px}
.modal p,.modal ul{margin:0;font-size:13px;color:var(--muted)}
.modal ul{padding-left:1.1em;display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--pill);color:var(--pill-ink);padding:8px 16px;border-radius:10px;font-size:13px}

@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .body{display:flex;flex-direction:column}
  .rows{overflow:visible}
  .side.mode-search{order:-1}
  .side.mode-search .scroll{overflow:visible}
  .side.mode-detail{display:none;position:fixed;inset:0;z-index:50;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.mode-detail.open{display:flex}
  .side .top .back{display:inline-flex}
  .side.mode-empty{display:none}
}
@media (max-width:560px){
  .row{grid-template-columns:34px minmax(0,1fr) 46px;gap:10px}
  .row .pr{display:none}
  .head span:nth-child(3){display:none}
  .meter{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
  .seg{flex:1 1 100%}
  .seg button{flex:1;justify-content:center}
}
</style>

  const STOP = /我想要|我想|我要|想要|帮我|请问|请|如何|怎么|怎样|做一个|做一款|做一套|做个|一个|一款|一套|可以|能够|需要|用来|用于|什么|有没有|哪个|推荐|好用|工具|技能|东西|相关|有关|关于|方面|一些|的|了|吗|呢|吧/g;
  const INTENTS = [
    { re: /图|照片|相片|海报|logo|标志|插画|绘|画|修图|抠图|美工|视觉|头像|封面|banner|平面/, label: "图片与设计", tool: ["图像与设计"], skill: ["内容创作", "前端设计"] },
    { re: /视频|影片|视讯|剪辑|短片|动画|vlog|字幕|特效/, label: "视频制作", tool: ["视频与音频"], skill: ["内容创作"] },

    { re: /程式|程序|编程|代码|开发|软件|app|写code|bug|调试|除错|测试|重构/, label: "编程开发", tool: ["编程与开发"], skill: ["编程工作流", "需求与规划"] },

  function normalize(s){ let o = ""; for (const ch of String(s).toLowerCase()) o += T2S[ch] || ch; return o; }
  const intents = s => { const n = normalize(s); return INTENTS.filter(x => x.re.test(n)); };
  function tokens(s){
    let n = normalize(s);
    const extra = SYN.filter(([re]) => re.test(n)).map(([, w]) => w).join(" ");
    n = (n + " " + extra).replace(STOP, " ");
    const set = new Set();
    for (const run of n.match(/[一-鿿]+|[0-9a-z.]+/g) || []){
      if (/^[一-鿿]+$/.test(run)){ for (let i = 0; i < run.length - 1; i++) set.add(run.slice(i, i + 2)); }
      else if (run.length >= 2) set.add(run);
    }
    return [...set];
  }
  function search(s){
    const toks = tokens(s), ints = intents(s);
    if (!toks.length && !ints.length) return [];
    return items.concat(hotOnly()).map(it => {
      const strong = normalize(it.name + " " + (it.kw || ""));
      const weak = normalize([it.summary, it.category, it.maker].join(" "));
      const deep = normalize(it.details ? [it.details.intro].concat(it.details.useCases || [], it.details.features || []).join(" ") : "");
      let sc = 0; const hit = [];
      for (const t of toks){
        if (strong.includes(t)){ sc += 2; hit.push(t); }
        else if (weak.includes(t)){ sc += 1; hit.push(t); }
        else if (deep.includes(t)) sc += 0.5;
      }
      let b = 0;
      for (const x of ints){ const k = (it.type === "工具" ? x.tool : x.skill).indexOf(it.category); if (k === 0) b = Math.max(b, 4); else if (k > 0) b = Math.max(b, 3); }
      return { it, s: sc + b, hit, cat: b > 0 };
    }).filter(r => r.s >= 2).sort((a, b) => b.s - a.s || (b.it.details ? 1 : 0) - (a.it.details ? 1 : 0) || (b.it.score || 0) - (a.it.score || 0));
  }

  const EXAMPLES = ["我想要做图片相关的设计", "我要做一个询问式的程式", "把长视频剪成短视频", "帮我做一个公司官网", "写论文查资料", "做简报", "做一个 logo"];

  $("chips").addEventListener("click", e => {
    const h = e.target.closest("[data-hot]"); if (h){ hotView = !hotView; cat = ""; renderList(); return; }
    const c = e.target.closest("[data-cat]"); if (c){ hotView = false; cat = c.dataset.cat; renderList(); }
  });
  $("price").addEventListener("change", e => { price = e.target.value; renderList(); });
  let timer;
  $("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => { q = e.target.value.trim(); renderSearch(); }, 150); });
  $("q").addEventListener("focus", () => { if (!q) renderSearch(); });
  $("q").addEventListener("keydown", e => { if (e.key === "Enter"){ clearTimeout(timer); q = e.target.value.trim(); renderSearch(); if (sample && q) askAI(); } if (e.key === "Escape"){ q = ""; e.target.value = ""; e.target.blur(); renderDetail(); } });
  $("aiBtn").addEventListener("click", () => { q = $("q").value.trim(); if (!q){ toast("先在搜索框描述你想做的事"); $("q").focus(); return; } renderSearch(); askAI(); });
  $("back").addEventListener("click", closeSheet);
  $("methodBtn").addEventListener("click", () => { $("methodModal").hidden = false; $("mClose").focus(); });
  $("mClose").addEventListener("click", () => $("methodModal").hidden = true);
  $("methodModal").addEventListener("click", e => { if (e.target.id === "methodModal") e.currentTarget.hidden = true; });
  document.addEventListener("keydown", e => { if (e.key === "Escape"){ $("methodModal").hidden = true; closeSheet(); } });
  document.addEventListener("click", e => {
    const cp = e.target.closest("[data-copy]"); if (cp){ copy(cp.dataset.copy, "已复制安装命令"); return; }
    const lk = e.target.closest("[data-link]"); if (lk){ copy(location.href.split("#")[0] + "#" + lk.dataset.link, "已复制链接，别人打开会直接看到这一项"); return; }
    const ex = e.target.closest("[data-ex]"); if (ex){ $("q").value = ex.dataset.ex; q = ex.dataset.ex; renderSearch(); return; }
    if (e.target.closest("#clearQ")){ q = ""; $("q").value = ""; renderDetail(); return; }
    const st = e.target.closest("[data-step]");
    if (st && sel){ const l = pool(), i = l.findIndex(x => x.id === sel.id) + Number(st.dataset.step); if (l[i]) select(l[i].id); return; }
    const r = e.target.closest("[data-id]"); if (r) select(r.dataset.id);
  });

  /* ---------- 载入数据 ---------- */
  function renderMeta(){
    $("updated").textContent = "每小时自动更新 · 更新于 " + (data.updatedTime || data.updatedAt || "—");
    $("edition").textContent = "第 " + (data.edition || 1) + " 期";
    $("n-tool").textContent = items.filter(i => i.type === "工具").length;
    $("n-skill").textContent = items.filter(i => i.type === "技能").length;
    $("method").textContent = data.method || "—";
    $("sources").innerHTML = (data.sources || []).map(s => '<li><a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener">'+esc(s.name)+'</a></li>').join("") || "<li>—</li>";
    $("log").innerHTML = (data.changelog || []).slice().reverse().slice(0, 8).map(c => '<li><span class="mono">'+esc(c.date)+'</span> '+esc(c.note)+'</li>').join("") || "<li>—</li>";
  }
  function useData(nd, first){
    data = nd; items = data.items || [];
    let deep = null;
    if (first){
      const h = (location.hash || "").replace("#", "");
      if (h === "skills") type = "技能";
      else if (h !== "tools"){ try { if (localStorage.getItem("ai100-board") === "技能") type = "技能"; } catch(e){} }
      deep = h && findAny(h);
      if (deep){ type = deep.type; if (deep.hotOnly) hotView = true; sel = deep; }
    }
    if (sel) sel = findAny(sel.id) || null;
    if (!sel) sel = pool()[0] || null;
    renderMeta(); renderList();
    if (q) renderSearch(); else renderDetail();
    if (deep && mobile()) $("side").classList.add("open");
  }
  const stamp = x => String(x.updatedTime || x.updatedAt || "");
  let embedded = null;
  try { embedded = JSON.parse($("ranking-data").textContent); } catch(e){}
  if (embedded && embedded.items) useData(embedded, true);
  else { $("rows").innerHTML = '<div class="empty">榜单数据读取失败，请刷新页面。</div>'; $("updated").textContent = "未载入"; }
  (async () => {
    const claude = window.claude;
    if (!claude || !claude.use) return;
    claude.use("sample").then(s => { sample = s; $("aiBtn").hidden = !s; }).catch(() => {});
    const db = await claude.use("db").catch(() => null);
    if (!db) return;
    db.doc("ranking/current").onSnapshot(snap => {
      if (!snap.exists) return;
      const nd = snap.data();
      if (nd && nd.items && (!data || stamp(nd) > stamp(data))) useData(nd, false);
    }, () => {});
  })();
})();
</script>

</body></html>
